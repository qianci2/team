<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星消乐 — 200 次逐关验证（BR-05 / BR-07 / NFR-08 上限口径）</title>
<style>
  body { background:#12151f; color:#e8ecf5; font:12px/1.5 Consolas,"Courier New",monospace; margin:0; padding:14px; }
  h1 { font-size:13px; color:#8fd0ff; margin:0 0 6px; }
  pre { white-space:pre-wrap; margin:0; }
</style>
</head>
<body>
<h1>星消乐 — 逐关验证：每关 200 次模拟（按《01》BR-02~BR-04 公式构关）</h1>
<pre id="out">运行中…（约 3~6 分钟）</pre>
<script src="../game/logic.js"></script>
<script src="../tests/solver.js"></script>
<script>
var out = [];
function say(s) { out.push(s); document.getElementById('out').textContent = out.join('\n'); }
var N = 200;
var L = GemzLogic;

/* ---- 按《01》BR-02~BR-04 的公式构造 30 关（与实现解耦，用于独立复核）---- */
function buildDocLevels() {
  var ls = [];
  for (var n = 1; n <= 30; n++) {
    var moves, target, ice = 0, dbl = 0, goals = [], color;
    if (n <= 5) {                                  // BR-02
      moves = 20 - (n - 1);
      target = 1000 + 300 * (n - 1);
      goals.push({ type: 'score', amount: target });
    } else if (n <= 15) {                          // BR-03
      var k = n - 6;
      moves = 20 - Math.floor(k / 2);
      target = 1400 + 100 * k;
      ice = 4 + Math.floor(k / 2);
      color = k % 5;
      goals.push({ type: 'score', amount: target });
      goals.push({ type: 'collect', color: color, amount: 10 + k });
    } else {                                       // BR-04
      var k2 = n - 16;
      moves = 25 - Math.floor(k2 / 3);
      target = 1900 + 60 * k2;
      ice = 7 + Math.floor(k2 / 5);
      dbl = 0.15;
      color = k2 % 5;
      goals.push({ type: 'score', amount: target });
      goals.push({ type: 'collect', color: color, amount: 14 + k2 });
      goals.push({ type: 'ice', amount: 0 });      // amount 稍后按实际布冰数修正
    }
    ls.push({ id: n, moves: moves, targetScore: target, ice: ice, doubleRatio: dbl, goals: goals, _seg: n <= 5 ? 1 : (n <= 15 ? 2 : 3) });
  }
  return ls;
}
/** Wilson 95% 置信区间 */
function wilson(k, n) {
  var p = k / n, z = 1.96, d = 1 + z * z / n;
  var c = p + z * z / (2 * n), h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n));
  return [(c - h) / d, (c + h) / d];
}
function q(arr, p) { return arr.length ? arr[Math.min(arr.length - 1, Math.floor(arr.length * p))] : 0; }

var levels = buildDocLevels();
var rows = [];
var allScoresForUpper = [];

for (var i = 0; i < levels.length; i++) {
  var lv = levels[i];
  var rngStat = { win: 0, scores: [], left: [], iceCleared: [] };
  // 第一遍：统计通过率、得分、剩余步数；冰层目标按"实际布冰数"取（与 FR-07 一致）
  for (var t = 0; t < N; t++) {
    var rng = L.makeRng(90000 + lv.id * 7919 + t * 104729);
    var b = L.newBoard(rng, lv.ice, lv.doubleRatio);
    var iceCount = lv.ice;                                  // 布冰数即目标数
    lv.goals.forEach(function (g) { if (g.type === 'ice') g.amount = iceCount; });
    var cells = b.cells, ice = b.ice;
    var movesLeft = lv.moves, score = 0, iceCleared = 0, collected = {}, guard = 0;
    var st = function () { return { score: score, collected: collected, iceCleared: iceCleared }; };
    while (movesLeft > 0 && guard++ < 400) {
      if (L.allGoalsMet(lv, st())) break;
      // 复用求解器的决策：按候选收益贪心
      var want = lv.goals.filter(function (g) { return g.type === 'collect' && (collected[g.color] || 0) < g.amount; }).map(function (g) { return g.color; });
      var needIce = lv.goals.some(function (g) { return g.type === 'ice' && iceCleared < g.amount; });
      var best = null;
      for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++) {
        var dirs = [[0, 1], [1, 0]];
        for (var d = 0; d < 2; d++) {
          var rr = r + dirs[d][0], cc = c + dirs[d][1];
          if (rr > 7 || cc > 7) continue;
          var a = L.idx(r, c), b2 = L.idx(rr, cc);
          if (!L.canSwap(cells, ice, a, b2)) continue;
          L.swapCells(cells, a, b2);
          var groups = L.findGroups(cells);
          if (!groups.length) { L.swapCells(cells, a, b2); continue; }
          var cl = 0, hits = 0, ih = 0;
          groups.forEach(function (g) { g.cells.forEach(function (ix) {
            cl++;
            if (want.indexOf(cells[ix].c) >= 0) hits++;
            if (ice[ix] > 0) ih++;
          }); });
          L.swapCells(cells, a, b2);
          var v = cl * 10 + 80 * hits + (needIce ? 200 : 0) * ih;
          if (!best || v > best.v) best = { a: a, b: b2, v: v };
        }
      }
      if (!best) { L.shuffleBoard(cells, ice, rng); continue; }
      var res = L.playMove(cells, ice, rng, best.a, best.b);
      if (!res.valid) continue;
      movesLeft--; score += res.gained; iceCleared += res.iceCleared;
      for (var kk = 0; kk < 5; kk++) collected[kk] = (collected[kk] || 0) + res.colorCounts[kk];
    }
    var won = L.allGoalsMet(lv, st());
    if (won) {
      rngStat.win++;
      rngStat.scores.push(score);
      rngStat.left.push(movesLeft);
      rngStat.iceCleared.push(iceCleared);
    }
  }
  rngStat.scores.sort(function (x, y) { return x - y; });
  rngStat.left.sort(function (x, y) { return x - y; });
  var ci = wilson(rngStat.win, N);
  var p50 = q(rngStat.scores, 0.5), p90 = q(rngStat.scores, 0.9), p99 = q(rngStat.scores, 0.99);
  // 目标分标定用：各关得分分位数（可按目标通过率反查分数线）
  var cdf = {};
  [0.1,0.2,0.25,0.3,0.4,0.5,0.6,0.7,0.75,0.8,0.9].forEach(function(pp){ cdf[pp] = q(rngStat.scores, pp); });
  var mx = rngStat.scores.length ? rngStat.scores[rngStat.scores.length - 1] : 0;
  var k2 = q(rngStat.left, 0.35), k3 = q(rngStat.left, 0.70);
  // 星级分布（按 BR-07 的 p70/p35 阈值）
  var s1 = 0, s2 = 0, s3 = 0;
  rngStat.left.forEach(function (r) { if (r >= k3) s3++; else if (r >= k2) s2++; else s1++; });
  rows.push({ lv: lv, rate: rngStat.win / N, ci: ci, p50: p50, p90: p90, p99: p99, mx: mx, cdf: cdf,
              k2: k2, k3: k3, s1: s1, s2: s2, s3: s3, n: rngStat.win });
  allScoresForUpper.push({ id: lv.id, p99: p99, mx: mx });
}

say('每关模拟 ' + N + ' 次；通过率按"达成全部目标"判定；冰层目标数 = 实际布冰数（BR-06 加权布置）。');
say('');
say('关 段 步数 目标分 | 通过率 [95%CI]        | 得分 p50/p90/p99/最大 | keep2 keep3 | 星级 1★/2★/3★');
for (var j = 0; j < rows.length; j++) {
  var r2 = rows[j], lv2 = r2.lv;
  say(String(lv2.id).padStart(2) + ' ' + lv2._seg + ' ' + String(lv2.moves).padStart(3) + ' ' + String(lv2.targetScore).padStart(5) + ' | ' +
      (r2.rate * 100).toFixed(1).padStart(5) + '% [' + (r2.ci[0] * 100).toFixed(1) + '~' + (r2.ci[1] * 100).toFixed(1) + '] | ' +
      String(r2.p50).padStart(5) + '/' + String(r2.p90).padStart(5) + '/' + String(r2.p99).padStart(5) + '/' + String(r2.mx).padStart(6) + ' | ' +
      String(r2.k2).padStart(4) + ' ' + String(r2.k3).padStart(4) + ' | ' +
      (r2.s1 / r2.n * 100).toFixed(0).padStart(3) + '%/' + (r2.s2 / r2.n * 100).toFixed(0).padStart(3) + '%/' + (r2.s3 / r2.n * 100).toFixed(0).padStart(3) + '%');
}
say('');
say('=== 目标分标定参考：各关得分分位数（p20/p25/p30 即让约 70~80% 的通关局达到的分数线）===');
rows.forEach(function(r){
  say('第' + String(r.lv.id).padStart(2) + '关 p20=' + String(r.cdf[0.2]).padStart(5) + ' p25=' + String(r.cdf[0.25]).padStart(5) +
      ' p30=' + String(r.cdf[0.3]).padStart(5) + ' p40=' + String(r.cdf[0.4]).padStart(5) +
      ' p50=' + String(r.cdf[0.5]).padStart(5) + ' p60=' + String(r.cdf[0.6]).padStart(5) + ' p70=' + String(r.cdf[0.7]).padStart(5));
});
say('');
var seg = function (a, b) {
  var v = rows.slice(a - 1, b);
  var wr = v.reduce(function (x, y) { return x + y.rate; }, 0) / v.length;
  return wr;
};
say('三段平均通过率：第 1 段 ' + (seg(1, 5) * 100).toFixed(1) + '% / 第 2 段 ' + (seg(6, 15) * 100).toFixed(1) + '% / 第 3 段 ' + (seg(16, 30) * 100).toFixed(1) + '%');
var low = rows.filter(function (r) { return r.rate < 0.6; });
say('通过率 < 60% 的关卡：' + (low.length ? low.map(function (r) { return '第' + r.lv.id + '关 ' + (r.rate * 100).toFixed(0) + '%'; }).join('、') : '无'));
say('');
var tot1 = 0, tot2 = 0, tot3 = 0, totN = 0;
rows.forEach(function (r) { tot1 += r.s1; tot2 += r.s2; tot3 += r.s3; totN += r.n; });
say('星级总分布（BR-07：keep3=p70、keep2=p35）：1★ ' + (tot1 / totN * 100).toFixed(1) + '% / 2★ ' + (tot2 / totN * 100).toFixed(1) + '% / 3★ ' + (tot3 / totN * 100).toFixed(1) + '%');
var worst2 = 1, worst3 = 1;
rows.forEach(function (r) { worst2 = Math.min(worst2, (r.s1 + r.s2 + r.s3 ? (r.s2 + r.s3) / r.n : 0)); worst3 = Math.min(worst3, r.s3 / r.n); });
say('最不利关卡达标率：2★ ' + (worst2 * 100).toFixed(0) + '%、3★ ' + (worst3 * 100).toFixed(0) + '%');
say('');
say('=== NFR-08 "单关得分参考上限"口径：US(n) = ceil(1.5 × p99(n)) ===');
var US = rows.map(function (r) { return { id: r.lv.id, p99: r.p99, mx: r.mx, US: Math.ceil(1.5 * r.p99) }; });
say('关: ' + US.map(function (x) { return x.id + ':' + x.US; }).join(' '));
var UT = US.reduce(function (a, b) { return a + b.US; }, 0);
say('总积分参考上限 UT = Σ US(n) = ' + UT);
say('（各关 p99 与实际最大观测值：' + US.map(function (x) { return x.id + ':' + x.p99 + '/' + x.mx; }).join(' ') + '）');
document.title = 'VERIFY200 DONE';
</script>
</body>
</html>
