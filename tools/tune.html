<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星消乐 — 关卡难度调参（BR-4）</title>
<style>
  body { background:#12151f; color:#e8ecf5; font:12.5px/1.65 Consolas,"Courier New",monospace; margin:0; padding:18px; }
  h1 { font-size:14px; color:#8fd0ff; margin:0 0 6px; }
  p.note { color:#9aa7bd; margin:0 0 14px; }
  pre { white-space:pre-wrap; margin:0; }
</style>
</head>
<body>
<h1>星消乐 — 关卡难度参数搜索（BR-4：每关通过率 ≥ 60%）</h1>
<p class="note">
  用 tests/solver.js 的普通玩家代理模拟，分别搜索第 6~15 关（SEG2）与第 16~30 关（SEG3）的难度参数。
  每关 20 次模拟。选定参数后写回 game/logic.js。
</p>
<pre id="out">运行中…（约需 1~3 分钟）</pre>
<script src="../game/logic.js"></script>
<script src="../tests/solver.js"></script>
<script>
var out = [];
function say(s){ out.push(s); document.getElementById('out').textContent = out.join('\n'); }
var N = 20;

function rate(level){
  var w = 0;
  for (var i=0;i<N;i++) if (GemzSolver.solve(level, 1000 + level.id*97 + i*13).win) w++;
  return w/N;
}
function segRates(seg2, seg3, from, to){
  var levels = GemzLogic.buildLevels({ seg2: seg2, seg3: seg3 }).slice(from-1, to);
  var rates = [], cells = [];
  for (var i=0;i<levels.length;i++){ var r = rate(levels[i]); rates.push(r); cells.push('关'+levels[i].id+':'+(r*100).toFixed(0)+'%'); }
  var worst = Math.min.apply(null, rates), avg = rates.reduce(function(a,b){return a+b;},0)/rates.length;
  return { rates: rates, cells: cells, worst: worst, avg: avg, levels: levels };
}

var SEG2_BASE = { movesFrom:20, movesTo:16, iceFrom:3, iceTo:10, dbl:0, targetFrom:1500, targetStep:150, collectFrom:9, collectStep:0.9 };
var SEG3_BASE = { movesFrom:25, movesTo:18, iceFrom:9, iceTo:14, dbl:0.35, targetFrom:2000, targetStep:120, collectFrom:12, collectStep:1 };

var seg2Cands = [
  { name:'S2-1 基线 moves20→16 ice3→10 分1500+150k 收9+0.9k', p: SEG2_BASE },
  { name:'S2-2 moves21→17 ice3→8 分1400+120k 收8+0.6k', p:{ movesFrom:21, movesTo:17, iceFrom:3, iceTo:8, dbl:0, targetFrom:1400, targetStep:120, collectFrom:8, collectStep:0.6 } },
  { name:'S2-3 moves20→18 ice2→7 分1300+110k 收8+0.5k', p:{ movesFrom:20, movesTo:18, iceFrom:2, iceTo:7, dbl:0, targetFrom:1300, targetStep:110, collectFrom:8, collectStep:0.5 } }
];
var seg3Cands = [
  { name:'S3-1 基线 moves25→18 ice9→14 双0.35 分2000+120k 收12+1k', p: SEG3_BASE },
  { name:'S3-2 moves25→21 ice5→9  双0.20 分1600+70k 收9+0.4k', p:{ movesFrom:25, movesTo:21, iceFrom:5, iceTo:9, dbl:0.20, targetFrom:1600, targetStep:70, collectFrom:9, collectStep:0.4 } },
  { name:'S3-3 moves25→22 ice5→9  双0.20 分1500+60k 收8+0.4k', p:{ movesFrom:25, movesTo:22, iceFrom:5, iceTo:9, dbl:0.20, targetFrom:1500, targetStep:60, collectFrom:8, collectStep:0.4 } },
  { name:'S3-4 moves26→23 ice4→8  双0.20 分1500+60k 收8+0.4k', p:{ movesFrom:26, movesTo:23, iceFrom:4, iceTo:8, dbl:0.20, targetFrom:1500, targetStep:60, collectFrom:8, collectStep:0.4 } },
  { name:'S3-5 moves26→23 ice4→8  双0.15 分1400+50k 收7+0.4k', p:{ movesFrom:26, movesTo:23, iceFrom:4, iceTo:8, dbl:0.15, targetFrom:1400, targetStep:50, collectFrom:7, collectStep:0.4 } }
];

say('### A. 第 6~15 关（SEG2）候选（SEG3 固定为基线）');
var s2res = [];
seg2Cands.forEach(function(cd,i){
  var r = segRates(cd.p, SEG3_BASE, 6, 15);
  say('  ' + cd.name);
  say('    冰格 ' + r.levels.map(function(l){return l.ice;}).join(',') + '   步数 ' + r.levels.map(function(l){return l.moves;}).join(','));
  say('    ' + r.cells.join(' ') + '   → 平均 ' + (r.avg*100).toFixed(1) + '% 最低 ' + (r.worst*100).toFixed(0) + '%');
  s2res.push({ name: cd.name, p: cd.p, worst: r.worst, avg: r.avg });
});
s2res.sort(function(a,b){ return b.worst - a.worst; });
say('  【排序】' + s2res.map(function(s){ return (s.worst*100).toFixed(0)+'%min/'+(s.avg*100).toFixed(0)+'%avg'; }).join('  '));
var pickS2 = s2res[0].p;
say('  【选定 SEG2】' + JSON.stringify(pickS2));

say('');
say('### B. 第 16~30 关（SEG3）候选（SEG2 固定为选定的 S2）');
var s3res = [];
seg3Cands.forEach(function(cd,i){
  var r = segRates(pickS2, cd.p, 16, 30);
  say('  ' + cd.name);
  say('    冰格 ' + r.levels.map(function(l){return l.ice;}).join(',') + '   步数 ' + r.levels.map(function(l){return l.moves;}).join(','));
  say('    ' + r.cells.join(' ') + '   → 平均 ' + (r.avg*100).toFixed(1) + '% 最低 ' + (r.worst*100).toFixed(0) + '%');
  s3res.push({ name: cd.name, p: cd.p, worst: r.worst, avg: r.avg });
});
s3res.sort(function(a,b){ return b.worst - a.worst; });
say('  【排序】' + s3res.map(function(s){ return (s.worst*100).toFixed(0)+'%min/'+(s.avg*100).toFixed(0)+'%avg'; }).join('  '));
var pickS3 = s3res[0].p;
say('  【选定 SEG3】' + JSON.stringify(pickS3));

say('');
say('### C. 选定参数下全 30 关通过率（每关 ' + N + ' 次）');
var all = GemzLogic.buildLevels({ seg2: pickS2, seg3: pickS3 });
var rates = [], line = [];
for (var i2=0;i2<all.length;i2++){
  var rr = rate(all[i2]); rates.push(rr); line.push((rr*100).toFixed(0)+'%');
  if (line.length === 10) { say('    关' + (i2-8) + '-关' + (i2+1) + ': ' + line.join(' ')); line = []; }
}
var worstAll = Math.min.apply(null, rates);
var avgAll = rates.reduce(function(a,b){return a+b;},0)/rates.length;
say('    → 最低 ' + (worstAll*100).toFixed(0) + '%  平均 ' + (avgAll*100).toFixed(1) + '%  ' + (worstAll>=0.6 ? '【满足 BR-4】' : '【仍不满足 BR-4】'));
say('');
say('### D. 写回 game/logic.js 的副本（直接覆盖 SEG2 / SEG3 常量即可）');
say('const SEG2 = ' + JSON.stringify(pickS2) + ';');
say('const SEG3 = ' + JSON.stringify(pickS3) + ';');
document.title = 'TUNE DONE';
</script>
</body>
</html>
