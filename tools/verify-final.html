<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星消乐 — 最终逐关验证（每关 200 次）</title>
<style>
  body { background:#12151f; color:#e8ecf5; font:12px/1.5 Consolas,"Courier New",monospace; margin:0; padding:14px; }
  h1 { font-size:13px; color:#8fd0ff; margin:0 0 6px; }
  pre { white-space:pre-wrap; margin:0; }
</style>
</head>
<body>
<h1>星消乐 — 最终逐关验证：每关 200 次（修正后的 BR-02~BR-04）</h1>
<pre id="out">运行中…（约 3~5 分钟）</pre>
<script src="../game/logic.js"></script>
<script src="../tests/solver.js"></script>
<script>
var out = [];
function say(s) { out.push(s); document.getElementById('out').textContent = out.join('\n'); }
var N = 200, L = GemzLogic;

/* ===== 修正后的关卡公式（本次提交的 BR-02~BR-04）===== */
function buildLevels(neutralGoal) {
  var ls = [];
  for (var n = 1; n <= 30; n++) {
    var moves, target, ice = 0, dbl = 0, goals = [], color, seg, collect = 0;
    if (n <= 5) {                                  // BR-02
      seg = 1; moves = 20 - (n - 1);
      target = 1200 + 80 * (n - 1);                // 修正：原 1000+300k
      goals.push({ type: 'score', amount: target });
    } else if (n <= 15) {                          // BR-03
      seg = 2; var k = n - 6;
      moves = 20 - Math.floor(k / 2);
      target = 1750 - 20 * k;                      // 修正：原 1400+100k（该段得分上限本身递减，目标分不能递增）
      ice = 4 + Math.floor(k / 2);
      collect = 10 + k;
      color = k % 5;
      goals.push({ type: 'score', amount: target });
      goals.push({ type: 'collect', color: color, amount: collect });
    } else {                                       // BR-04
      seg = 3; var k2 = n - 16;
      moves = 25 - Math.floor(k2 / 3);
      target = 1900 + 30 * k2;                     // 修正：原 1900+60k
      ice = 4 + Math.floor(k2 / 6);
      collect = 10 + Math.floor(0.5 * k2);         // 修正：原 14+k（200 次模拟显示该段瓶颈是收集与冰层目标）
      dbl = 0.15; color = k2 % 5;
      goals.push({ type: 'score', amount: target });
      goals.push({ type: 'collect', color: color, amount: collect });
      goals.push({ type: 'ice', amount: ice });
    }
    if (neutralGoal) goals[0].amount = 9e9;
    ls.push({ id: n, moves: moves, targetScore: target, ice: ice, doubleRatio: dbl, goals: goals, _seg: seg, _collect: collect });
  }
  return ls;
}
function q(a, p) { return a.length ? a[Math.min(a.length - 1, Math.floor(a.length * p))] : 0; }
function wilson(k, n) { var p = k / n, z = 1.96, d = 1 + z * z / n, c = p + z * z / (2 * n), h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)); return [(c - h) / d, (c + h) / d]; }

function runOnce(lv, seed) {
  var rng = L.makeRng(seed);
  var b = L.newBoard(rng, lv.ice, lv.doubleRatio);
  var cells = b.cells, ice = b.ice;
  var movesLeft = lv.moves, score = 0, iceCleared = 0, collected = {}, guard = 0;
  var st = function () { return { score: score, collected: collected, iceCleared: iceCleared }; };
  while (movesLeft > 0 && guard++ < 400) {
    if (L.allGoalsMet(lv, st())) break;
    var want = lv.goals.filter(function (g) { return g.type === 'collect' && (collected[g.color] || 0) < g.amount; }).map(function (g) { return g.color; });
    var needIce = lv.goals.some(function (g) { return g.type === 'ice' && iceCleared < g.amount; });
    var best = null;
    for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++) {
      var dirs = [[0, 1], [1, 0]];
      for (var d = 0; d < 2; d++) {
        var rr = r + dirs[d][0], cc = c + dirs[d][1];
        if (rr > 7 || cc > 7) continue;
        var a = L.idx(r, c), b2 = L.idx(rr, cc);
        if (!L.canSwap(cells, ice, a, b2)) continue;
        L.swapCells(cells, a, b2);
        var groups = L.findGroups(cells);
        if (!groups.length) { L.swapCells(cells, a, b2); continue; }
        var cl = 0, hits = 0, ih = 0;
        groups.forEach(function (g) { g.cells.forEach(function (ix) { cl++; if (want.indexOf(cells[ix].c) >= 0) hits++; if (ice[ix] > 0) ih++; }); });
        L.swapCells(cells, a, b2);
        var v = cl * 10 + 80 * hits + (needIce ? 200 : 0) * ih;
        if (!best || v > best.v) best = { a: a, b: b2, v: v };
      }
    }
    if (!best) { L.shuffleBoard(cells, ice, rng); continue; }
    var res = L.playMove(cells, ice, rng, best.a, best.b);
    if (!res.valid) continue;
    movesLeft--; score += res.gained; iceCleared += res.iceCleared;
    for (var kk = 0; kk < 5; kk++) collected[kk] = (collected[kk] || 0) + res.colorCounts[kk];
  }
  return { won: L.allGoalsMet(lv, st()), score: score, left: movesLeft,
           collectOk: lv.goals.filter(function (g) { return g.type === 'collect'; }).every(function (g) { return (collected[g.color] || 0) >= g.amount; }),
           iceOk: lv.goals.filter(function (g) { return g.type === 'ice'; }).every(function (g) { return iceCleared >= g.amount; }),
           scoreOk: score >= lv.goals[0].amount };
}

var levels = buildLevels(false);
say('每关 ' + N + ' 次；通过率 = 达成全部目标的局数占比；星级阈值按各关"完成时剩余步数"的 p70/p35 标定。');
say('');
say('关 段 步 目标 收集 冰 | 通过率 [95%CI] | 得分 p50/p90/p99 | 剩余步数 p35/p70 | 星级 1★/2★/3★ | 失败主因');
var rows = [];
for (var i = 0; i < levels.length; i++) {
  var lv = levels[i];
  var win = 0, scores = [], lefts = [], fCollect = 0, fIce = 0, fScore = 0;
  for (var t = 0; t < N; t++) {
    var r = runOnce(lv, 90000 + lv.id * 7919 + t * 104729);   // 一步贪心（附录 B 口径）
    if (r.won) { win++; scores.push(r.score); lefts.push(r.left); }
    else { if (!r.collectOk) fCollect++; if (!r.iceOk) fIce++; if (!r.scoreOk) fScore++; }
  }
  scores.sort(function (a, b) { return a - b; });
  lefts.sort(function (a, b) { return a - b; });
  var ci = wilson(win, N);
  var k2 = q(lefts, 0.35), k3 = q(lefts, 0.70);
  var s1 = 0, s2 = 0, s3 = 0;
  lefts.forEach(function (r) { if (r >= k3) s3++; else if (r >= k2) s2++; else s1++; });
  rows.push({ lv: lv, rate: win / N, ci: ci, k2: k2, k3: k3, s1: s1, s2: s2, s3: s3, n: win,
              p99: q(scores, 0.99), p50: q(scores, 0.5), p90: q(scores, 0.9),
              f: { c: fCollect, i: fIce, s: fScore } });
  var fails = win === N ? '—' : ('收集' + fCollect + ' 冰' + fIce + ' 分' + fScore);
  say(String(lv.id).padStart(2) + ' ' + lv._seg + ' ' + String(lv.moves).padStart(2) + ' ' + String(lv.targetScore).padStart(4) + ' ' +
      String(lv._collect || 0).padStart(4) + ' ' + String(lv.ice).padStart(2) + ' | ' +
      (win / N * 100).toFixed(1).padStart(5) + '% [' + (ci[0] * 100).toFixed(1) + '~' + (ci[1] * 100).toFixed(1) + '] | ' +
      String(q(scores, 0.5)).padStart(5) + '/' + String(q(scores, 0.9)).padStart(5) + '/' + String(q(scores, 0.99)).padStart(5) + ' | ' +
      String(k2).padStart(3) + ' ' + String(k3).padStart(3) + ' | ' +
      (s1 / Math.max(1, win) * 100).toFixed(0).padStart(3) + '%/' + (s2 / Math.max(1, win) * 100).toFixed(0).padStart(3) + '%/' + (s3 / Math.max(1, win) * 100).toFixed(0).padStart(3) + '% | ' + fails);
}
say('');
var segAvg = function (a, b) { var v = rows.slice(a - 1, b); return v.reduce(function (x, y) { return x + y.rate; }, 0) / v.length; };
say('三段平均通过率：第 1 段 ' + (segAvg(1, 5) * 100).toFixed(1) + '% / 第 2 段 ' + (segAvg(6, 15) * 100).toFixed(1) + '% / 第 3 段 ' + (segAvg(16, 30) * 100).toFixed(1) + '%');
var low = rows.filter(function (r) { return r.rate < 0.6; });
say('通过率 < 60% 的关卡：' + (low.length ? low.map(function (r) { return '第' + r.lv.id + '关 ' + (r.rate * 100).toFixed(1) + '%'; }).join('、') : '无 ✓'));
var lowCI = rows.filter(function (r) { return r.ci[0] < 0.53; });
say('CI 下界 < 53% 的关卡：' + (lowCI.length ? lowCI.map(function (r) { return '第' + r.lv.id + '关 ' + (r.ci[0] * 100).toFixed(1) + '%'; }).join('、') : '无 ✓'));
say('');
var t1 = 0, t2 = 0, t3 = 0, tn = 0;
rows.forEach(function (r) { t1 += r.s1; t2 += r.s2; t3 += r.s3; tn += r.n; });
say('星级总分布：1★ ' + (t1 / tn * 100).toFixed(1) + '% / 2★ ' + (t2 / tn * 100).toFixed(1) + '% / 3★ ' + (t3 / tn * 100).toFixed(1) + '%（共 ' + tn + ' 个通关样本）');
var w2 = 1, w3 = 1;
rows.forEach(function (r) { if (r.n) { w2 = Math.min(w2, (r.s2 + r.s3) / r.n); w3 = Math.min(w3, r.s3 / r.n); } });
say('最不利关卡达标率：2★ ' + (w2 * 100).toFixed(0) + '% / 3★ ' + (w3 * 100).toFixed(0) + '%');
say('');
say('=== NFR-08 口径：US(n) = ceil(1.5 × p99 通关得分)，UT = ΣUS(n) ===');
var US = rows.map(function (r) { return Math.ceil(1.5 * (r.p99 || 0)); });
say('US(n)=' + US.join(','));
say('UT = ' + US.reduce(function (a, b) { return a + b; }, 0));
say('');
say('=== 逐关 keep2/keep3（写回 BR-07 参考）===');
say(rows.map(function (r) { return r.lv.id + ':' + r.k2 + '/' + r.k3; }).join('  '));
document.title = 'FINAL VERIFY DONE';
</script>
</body>
</html>
