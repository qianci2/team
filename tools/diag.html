<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星消乐 — 关卡卡点诊断（读 logic.js 当前默认配置）</title>
<style>
  body { background:#12151f; color:#e8ecf5; font:12.5px/1.65 Consolas,"Courier New",monospace; margin:0; padding:18px; }
  h1 { font-size:14px; color:#8fd0ff; margin:0 0 6px; }
  pre { white-space:pre-wrap; margin:0; }
</style>
</head>
<body>
<h1>星消乐 — 卡点诊断（每关 20 次，读 game/logic.js 当前 SEG 默认值）</h1>
<pre id="out">运行中…</pre>
<script src="../game/logic.js"></script>
<script src="../tests/solver.js"></script>
<script>
var out = [];
function say(s){ out.push(s); document.getElementById('out').textContent = out.join('\n'); }
var N = 20;
var levels = GemzLogic.buildLevels();
say('关  通过率  未达分  未收集  未清冰 | 分缺口 收缺口 冰缺口 | 平均星 通关星 | 参数');
for (var i=0;i<30;i++){
  var lv = levels[i], win=0, fs=0, fc=0, fi=0, gc=0, gs=0, gc2=0, gi=0, stars=0, winStars=0;
  for (var k=0;k<N;k++){
    var r = GemzSolver.solve(lv, 1000 + lv.id*97 + k*13);
    stars += r.stars;
    if (r.win){ win++; winStars += r.stars; }
    else {
      gc++;
      lv.goals.forEach(function(g){
        var cur = g.type==='score' ? r.score : (g.type==='collect' ? (r.collected[g.color]||0) : r.iceCleared);
        var gap = (g.amount - cur)/g.amount;
        if (gap <= 0) return;
        if (g.type==='score'){ fs++; gs += gap; }
        else if (g.type==='collect'){ fc++; gc2 += gap; }
        else { fi++; gi += gap; }
      });
    }
  }
  var cg = lv.goals.filter(function(g){return g.type==='collect';})[0];
  say('第' + String(lv.id).padStart(2) + ' ' + (win/N*100).toFixed(0).padStart(4) + '%  ' +
      (gc?(fs/gc*100).toFixed(0):'0').padStart(5) + '%  ' + (gc?(fc/gc*100).toFixed(0):'0').padStart(5) + '%  ' + (gc?(fi/gc*100).toFixed(0):'0').padStart(5) + '%  | ' +
      (fs?(gs/fs*100).toFixed(0):'-').padStart(5) + '% ' + (fc?(gc2/fc*100).toFixed(0):'-').padStart(5) + '% ' + (fi?(gi/fi*100).toFixed(0):'-').padStart(5) + '% | ' +
      (stars/N).toFixed(2) + '  ' + (win?(winStars/win).toFixed(2):'-') + '  ' +
      '冰' + lv.ice + ' 双' + lv.doubleRatio + ' 步' + lv.moves + ' 分' + lv.targetScore + (cg? ' 收' + cg.amount : ''));
}
document.title = 'DIAG2 DONE';
</script>
</body>
</html>
