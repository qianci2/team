<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>星消乐 · 分层特效实验室</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070a10;
        --panel: rgba(14, 18, 28, 0.82);
        --line: rgba(255, 255, 255, 0.12);
        --text: #f7f3ea;
        --muted: #99a3b6;
        --accent: #ffd28a;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
      .top {
        position: fixed;
        inset: 16px 16px auto;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        pointer-events: none;
      }
      .copy {
        max-width: 560px;
        padding: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        backdrop-filter: blur(16px);
        pointer-events: auto;
      }
      .eyebrow {
        margin: 0 0 4px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.2em;
      }
      h1 { margin: 0; font-size: clamp(20px, 2.4vw, 30px); letter-spacing: -0.03em; }
      p { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
      .top a {
        pointer-events: auto;
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: var(--panel);
        color: var(--text);
        text-decoration: none;
        font-size: 12px;
      }
      .chips {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        width: min(880px, calc(100vw - 20px));
        padding: 7px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        backdrop-filter: blur(16px);
      }
      .chips button {
        min-height: 38px;
        padding: 0 12px;
        border: 1px solid transparent;
        border-radius: 12px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .chips button:hover { color: var(--text); background: rgba(255,255,255,.06); }
      .chips button[aria-pressed="true"] { color: #1b160d; background: var(--accent); }
      .chips .auto { margin-left: auto; border-color: var(--line); }
      .hint {
        position: fixed;
        right: 16px;
        bottom: 78px;
        color: var(--muted);
        font-size: 11px;
        text-align: right;
        line-height: 1.7;
        pointer-events: none;
      }
      .hint strong { color: var(--text); }
      @media (max-width: 700px) {
        .top { inset: 8px 8px auto; }
        .copy { padding: 9px 11px; border-radius: 13px; }
        .copy p:not(.eyebrow) { display: none; }
        .top a { min-height: 36px; padding: 0 9px; font-size: 11px; }
        .chips { bottom: 8px; gap: 3px; padding: 5px; }
        .chips button { min-height: 34px; padding: 0 8px; font-size: 11px; }
        .chips .auto { margin-left: 0; }
        .hint { display: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="lab" aria-label="分层特效实验室画布"></canvas>

    <div class="top">
      <div class="copy">
        <p class="eyebrow">LAYERED FX LAB · 3 EFFECTS</p>
        <h1>分层特效实验室</h1>
        <p>在棋盘上触发：花瓣光晕、烟尘、碎片、冰裂纹、引力漩涡。点击格子重放；数字键 1–3 切换。</p>
      </div>
      <a href="/">← 返回游戏</a>
    </div>

    <div class="hint">
      <strong>点击</strong> 任意格子触发<br />
      <strong>1–3</strong> 切换 · <strong>空格</strong> 重放
    </div>

    <nav class="chips" aria-label="特效列表">
      <button type="button" data-mode="0" aria-pressed="true">01 星爆</button>
      <button type="button" data-mode="1" aria-pressed="false">02 霜裂</button>
      <button type="button" data-mode="2" aria-pressed="false">03 引力</button>
      <button type="button" class="auto" id="auto" aria-pressed="true">自动循环</button>
    </nav>

    <script type="module" src="/web/fx-lab.js"></script>
  </body>
</html>
